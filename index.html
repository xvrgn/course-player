<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Courses</title>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@100..900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js" defer></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <button class="btn" id="back" hidden>&larr; Dashboard</button>
  <h1 id="title">My Courses</h1>
  <button class="btn" id="change" hidden>Change folder</button>
</header>
<main id="home"></main>
<section id="course">
  <div class="lay">
    <div class="main">
      <div class="stage" id="stage"></div>
      <div class="info">
        <h3 id="ft"></h3>
        <p id="fs"></p>
        <div class="row">
          <button class="btn" id="prev">&larr; Previous</button>
          <button class="btn pri" id="next">Next &rarr;</button>
        </div>
      </div>
    </div>
    <aside class="side"><h4>Course content</h4><div id="toc"></div></aside>
  </div>
</section>
<input type="file" id="picker" webkitdirectory multiple hidden>

<script src="js/app.js"></script>
</body>
</html>
